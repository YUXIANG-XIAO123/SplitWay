# SplitWay 前端 nginx 配置
# - 静态托管 Vite 产物（SPA history 模式回退到 index.html）
# - /api 反向代理到 backend:8000，使浏览器与后端同源，从结构上消灭通配 CORS（架构 §1.1 / D17）
#
# 监听端口固定为 80，与 docker-compose.yml 中 frontend 服务
# 的端口映射 `${FRONTEND_PORT:-8080}:80` 一致。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩（对前端产物收益明显）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # SPA history 路由：非文件请求一律回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理：保留 /api 前缀（后端路由统一前缀即 /api）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # 构建产物带哈希，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
