# Alembic configuration (SplitWay, issue #1)
#
# The database URL is deliberately NOT set here: alembic/env.py injects it from
# app.config, and app.config reads environment variables only. That keeps the
# database configuration in exactly one place across the whole repository.
#
# NOTE -- keep this file ASCII-only.
# Alembic reads alembic.ini through configparser with encoding="locale"
# (alembic/util/compat.py -> read_config_parser). On a machine whose locale is
# GBK that raises UnicodeDecodeError before any migration runs, and an image
# with an unset LANG can hit the same failure. Chinese comments are fine
# everywhere else, because .py sources are always decoded as UTF-8.

[alembic]
script_location = alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
