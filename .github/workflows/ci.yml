name: backend-ci

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: travelshare
          POSTGRES_PASSWORD: travelshare
          POSTGRES_DB: travelshare
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U travelshare"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://travelshare:travelshare@localhost:5432/travelshare
      JWT_SECRET: ci_ephemeral_jwt_value
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run pytest
        working-directory: backend
        run: pytest -q
